name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  QUARTZ_REF: v4.5.2
  VAULT_DIR: Principal SWE

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: ${{ env.QUARTZ_REF }}
          path: quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Assemble content
        run: |
          # .obsidian, .trash and tools are dropped by ignorePatterns in quartz.config.ts.
          cp -R "vault/$VAULT_DIR" content
          # Quartz needs an index.md at the content root for the landing page.
          cp "content/$VAULT_DIR.md" content/index.md

      - name: Check for broken links
        env:
          VAULT_CONTENT: content
        run: python3 vault/tools/check_links.py

      - name: Install Quartz
        working-directory: quartz
        run: npm ci

      - name: Build
        run: |
          cp vault/site/quartz.config.ts quartz/quartz.config.ts
          cp vault/site/quartz.layout.ts quartz/quartz.layout.ts
          cp vault/site/custom.scss quartz/quartz/styles/custom.scss
          cp vault/site/plugins.ts quartz/quartz/plugins/transformers/site.ts
          cp vault/site/ReadingControls.tsx quartz/quartz/components/ReadingControls.tsx
          cp vault/site/readingControls.inline.ts quartz/quartz/components/scripts/readingControls.inline.ts
          cp vault/site/readingControls.scss quartz/quartz/components/styles/readingControls.scss
          cp vault/site/PagefindSearch.tsx quartz/quartz/components/PagefindSearch.tsx
          cp vault/site/pagefindSearch.inline.ts quartz/quartz/components/scripts/pagefindSearch.inline.ts
          cp vault/site/pagefindSearch.scss quartz/quartz/components/styles/pagefindSearch.scss
          cp vault/site/SiblingNav.tsx quartz/quartz/components/SiblingNav.tsx
          cp vault/site/siblingNav.scss quartz/quartz/components/styles/siblingNav.scss
          # Quartz leaves a backtick in the slug; it reaches the URL as %60 and
          # GitHub Pages answers 404 for that path. tools/check_links.py already
          # rejects such filenames — this is the second line of defence.
          python3 vault/tools/patch_slug.py quartz/quartz/util/path.ts
          cd quartz
          npx quartz build -d "$GITHUB_WORKSPACE/content" -o "$GITHUB_WORKSPACE/public"

      - name: Build search index (Pagefind)
        run: npx -y pagefind@latest --site public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
